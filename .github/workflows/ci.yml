name: Kotlin CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, and compile examples
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Exercise executable help
        run: java -jar target/naval-sdk-kotlin-0.1.0-all.jar --help
      - name: Archive distributable JARs
        if: matrix.java == '17'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: naval-sdk-kotlin-0.1.0
          path: target/naval-sdk-kotlin-0.1.0*.jar
          if-no-files-found: error
